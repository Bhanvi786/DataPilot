<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C997" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14231E" />
      <stop offset="100%" stop-color="#0D1512" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Rounded Square -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#card-grad)" stroke="#244536" stroke-width="2.5" />
  
  <!-- Analytics Chart Bars -->
  <rect x="28" y="68" width="10" height="24" rx="4" fill="#244536" />
  <rect x="44" y="52" width="10" height="40" rx="4" fill="#20C997" opacity="0.75" />
  <rect x="60" y="38" width="10" height="54" rx="4" fill="url(#gradient-accent)" />
  <rect x="76" y="26" width="10" height="66" rx="4" fill="#6EE7B7" filter="url(#glow)" />
  
  <!-- AI Sparkle / Pilot Node -->
  <circle cx="81" cy="24" r="5" fill="#FFFFFF" />
  <path d="M 33 66 Q 55 48 78 26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.9" />
  
  <!-- Floating Mini Nodes -->
  <circle cx="33" cy="66" r="3" fill="#20C997" />
  <circle cx="49" cy="50" r="3" fill="#20C997" />
  <circle cx="65" cy="36" r="3" fill="#6EE7B7" />
</svg>
